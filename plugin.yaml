name: model-router
label: Model Router
kind: standalone
version: 0.3.0
manifest_version: 2
api_version: 1
author: zulloper
license: MIT
description: >
  Picks a model and reasoning effort for each turn from the kind of task you
  give, but only from an allowlist you check off (up to 3 providers and the
  models you choose on each). When a model is stopped by a guardrail, a
  refusal or a provider error, it moves to the next allowed model; a
  route_explore tool runs the same task on several allowed models as
  subagents and remembers the winner. Security work (CVE analysis, exploits,
  PoCs, red team) gets its own task class, an authorization/output-contract
  preamble, refusal and empty-answer retries, and an NVD lookup tool.
  Public plugin API by default; switching the session across providers is an
  opt-in that uses Hermes internals.
requires_hermes: ">=0.22.5"
tags: [routing, models, reasoning, fallback, guardrails, security, cve, exploit, redteam]
provides_tools:
  - route_explore
  - cve_lookup
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - post_api_request
  - api_request_error
  - transform_api_error_classification
  - transform_llm_output
provides_middleware:
  - llm_request
capabilities:
  - llm.model_override     # soft-refusal re-answer / explore judge on an allowed model
  - llm.provider_override  # ... which may sit on another allowed provider
config_schema:
  mode:
    type: str
    choices: ["auto", "off"]
    default: auto
    label: Routing mode
    description: "auto: pick a model per turn. off: leave the session's model alone."
  scope:
    type: dict
    default: {}
    label: Allowed providers and models
    description: >
      The allowlist. Up to 3 providers, each with the models routing may use,
      e.g. {"openai-codex": ["gpt-6.2-sol"], "anthropic": ["claude-opus-4-8"]}.
      Nothing outside it is ever picked. Edit with `hermes model-router setup`.
  routes:
    type: dict
    default: {}
    label: Routes per task class
    description: >
      Ordered candidates per task class (quick, standard, code, deep, sec) as
      "provider/model@effort", e.g. {"sec": ["anthropic/claude-opus-4-8@xhigh"]}.
      Entries outside the allowlist are ignored. Empty: built from the allowlist.
  tiers:
    type: list
    default: []
    label: Tier ladder (0.4.0, in development)
    description: >
      Ordered tiers, each a list of "provider/model" entries, e.g.
      [["openai-codex/gpt-6.2-sol"], ["anthropic/claude-opus-4-8"]]. When a reply is blocked,
      the models of tier 1 are tried first, then tier 2, and so on. The ladder is also the
      allowlist. Parsed and validated only for now; routing still uses scope/routes.
  cross_provider:
    type: bool
    default: false
    label: Switch the session across providers (uses Hermes internals)
    description: >
      Off: routing only changes the model within the provider the session is
      on (public API). On: the session itself is moved to another allowed
      provider when the route says so. May break on a Hermes update; falls
      back to off if the internals are missing.
  classifier:
    type: str
    choices: [rules, hybrid, llm]
    default: rules
    label: Task classifier
    description: "rules: keywords and length, no extra call. hybrid: ask a model only when rules are unsure. llm: always ask a model."
  soft_refusal_retry:
    type: bool
    default: true
    label: Re-answer soft refusals with another allowed model
  degraded_retry:
    type: bool
    default: true
    label: Redo security answers that skip the requested code
    description: >
      On sec turns, an answer that was asked for a PoC/code but is prose only is retried on
      another allowed model with an output contract.
  security_preamble:
    type: bool
    default: true
    label: Inject the security preamble on sec turns
    description: >
      Adds authorization, an output contract (complete runnable PoC, exact offsets, no hedging)
      and a CVE workflow to the system prompt of security turns. Does not remove provider guardrails.
  security_roe:
    type: str
    default: ""
    label: Rules of engagement to include
    description: Target/scope/period/contacts. Models refuse less when authorization is explicit.
  security_preamble_extra:
    type: str
    default: ""
    label: Extra standing instructions
    description: Appended to the security preamble, e.g. tooling or format preferences.
  security_guardrail_defaults:
    type: bool
    default: true
    label: Treat generic "content filter / safety / cyber" errors as guardrails
  security_sanitize:
    type: bool
    default: true
    label: Guardrail round-trip (sanitize a refused request and retry)
    description: >
      After a guardrail/refusal on a sec turn, rephrase the request (framing terms only; facts
      stay verbatim), retry (same model first where possible), then restore the answer's terms
      and check the locked facts. Levels escalate: L1 wording, L2 walkthrough structure, L3 split.
  security_sanitize_max_level:
    type: int
    default: 3
    label: Highest sanitize level (1-3)
  security_sanitize_llm:
    type: bool
    default: false
    label: Let a model rephrase the refused request (L2+)
    description: One extra structured call; deterministic rules run first and remain the fallback.
  security_sanitize_retry_same_model:
    type: bool
    default: true
    label: Retry the refused model at the next level before switching
  security_fact_lock:
    type: bool
    default: true
    label: Lock CVE ids, versions, offsets, hashes and symbols
    description: >
      Locked facts are never substituted; if the answer drops one, it is retried with the missing
      facts listed and the footer reports anything still unconfirmed.
  hold_stream:
    type: bool
    label: Hold streamed replies until the refusal check ran (restart to apply)
    description: >
      Unset: on when tiers are configured, off otherwise. Replies that end on a provider error
      can only be replaced while held. Holding turns off streaming.
  retry_budget_seconds:
    type: str
    default: auto
    label: Time budget for climbing the ladder (seconds, or auto)
    description: >
      auto: a few seconds inside plugins.hook_callback_timeout. Raise that timeout (180-300 is
      recommended) to give the ladder room; a budget above it is capped to it.
  cooldown_minutes:
    type: int
    default: 30
    label: Minutes a model sits out after failing twice in a row
  max_explore:
    type: int
    default: 3
    label: Models route_explore runs at most
  extra_guardrail_patterns:
    type: list
    default: []
    label: Extra guardrail phrases
    description: Lower-case phrases in a provider error that mean a guardrail stopped the request.
