name: model-router
label: Model Router
kind: standalone
version: 0.4.0
manifest_version: 2
api_version: 1
author: zulloper
license: MIT
description: >
  A tier ladder for blocked replies. The profile's own model answers every
  turn; when a reply is blocked (a guardrail, a refusal, an answer without the
  code that was asked for, a model error), the models you put on tier 1 are
  asked the same request in parallel, then tier 2, and so on — each tier first
  as written, then once more enriched with your rules of engagement, an output
  contract and locked facts. Good answers from a tier are combined, and the
  result replaces the blocked reply. Models that keep winning move up the
  ladder. Also: an NVD lookup tool and a model comparison tool. Public plugin
  API only.
requires_hermes: ">=0.22.5"
tags: [routing, models, fallback, guardrails, refusal, security, cve]
provides_tools:
  - route_explore
  - cve_lookup
provides_hooks:
  - pre_llm_call
  - post_api_request
  - api_request_error
  - transform_api_error_classification
  - transform_llm_output
capabilities:
  - llm.model_override     # retries and synthesis run on the ladder's models
  - llm.provider_override  # ... which may sit on another provider than the session's
config_schema:
  mode:
    type: str
    choices: ["auto", "off"]
    default: auto
    label: Climb the ladder on blocked replies
    description: "auto: a blocked reply climbs the tiers. off: replies stay as they are."
  tiers:
    type: list
    default: []
    label: Tier ladder
    description: >
      Ordered tiers, each a list of "provider/model", e.g.
      [["openai-codex/gpt-6.2-sol"], ["anthropic/claude-opus-4-8", "xai/grok-5"]].
      Tier 1 is asked first. Within a tier the order is the priority. The ladder
      is also the allowlist: nothing else is called. Edit with
      `hermes model-router setup` or the Desktop settings pages.
  parallel:
    type: bool
    default: true
    label: Ask a tier's models in parallel
    description: Off asks them one after another and stops at the first good answer.
  synthesize:
    type: bool
    default: true
    label: Combine two or more good answers from a tier
    description: >
      One more call, on the first good answer's model, merges the tier's good answers. Skipped
      when time is short; if it fails, the first good answer is used.
  enrich_on_retry:
    type: bool
    default: true
    label: Retry each tier once more with an enriched request
    description: >
      After a tier's models fail on the request as written: quote your rules of engagement (if
      set), add an output contract when code was asked for, reword framing terms (facts stay
      verbatim and are checked in the answer), and ask the tier again.
  auto_promote:
    type: bool
    default: true
    label: Move models that keep winning up the ladder
    description: >
      Learned from the attempt log (requests as written only). Never rewrites tiers and never puts a
      model below where you placed it; /route shows promotions and /route reset clears them.
  security_roe:
    type: str
    default: ""
    label: Rules of engagement
    description: >
      Target, scope, period, approver. Quoted (first 600 characters) in enriched retries; with none
      set, no authorization is ever claimed.
  hold_stream:
    type: str
    choices: ["auto", "on", "off"]
    default: auto
    label: Hold replies until the blocked-reply check ran (restart to apply)
    description: >
      auto: on when tiers are set. Replies that end on a provider error can only be replaced while
      held. Holding turns off streaming.
  retry_budget_seconds:
    type: str
    default: auto
    label: Time budget for climbing the ladder (seconds, or auto)
    description: >
      auto: a few seconds inside plugins.hook_callback_timeout. Raise that timeout (180-300 is
      recommended) to give the ladder room; a budget above it is capped to it.
  security_guardrail_defaults:
    type: bool
    default: true
    label: Treat "content filter / safety / cyber" provider errors as guardrail blocks
  extra_guardrail_patterns:
    type: list
    default: []
    label: Extra guardrail phrases
    description: Lower-case phrases in a provider error that mean a guardrail stopped the request.
  max_explore:
    type: int
    default: 3
    label: Models route_explore compares at most
